<div class="site-chrome">
<div class="announce">{{ announceText }}</div>

<!-- ===== DESKTOP HEADER ===== -->
<header class="site-header desktop-header">
  <div class="header-inner giva-row">
    <div class="header-logo">
      <a routerLink="/">
        <img [src]="logoUrl" [alt]="siteName" />
      </a>
    </div>

    <div class="deliver-wrap">
      <button type="button" class="deliver" (click)="togglePin($event)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/>
        </svg>
        <span>
          <b>Where to Deliver?</b>
          <small>{{ deliverPin ? 'Deliver to ' + deliverPin : 'Enter pincode' }} &gt;</small>
        </span>
      </button>
      <div class="pin-pop" *ngIf="pinOpen" (click)="$event.stopPropagation()">
        <p>Where to deliver?</p>
        <input type="text" inputmode="numeric" maxlength="6" [(ngModel)]="pinDraft" placeholder="6 digit pincode" (keyup.enter)="savePin()" />
        <button type="button" (click)="savePin()">Update</button>
      </div>
    </div>

    <form class="giva-search" (submit)="$event.preventDefault(); onSearch()">
      <input type="search" [(ngModel)]="searchTxt" name="deskSearch" [placeholder]="searchPlaceholder" />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/>
        </svg>
      </button>
    </form>

    <nav class="giva-tools">
      <a routerLink="/shop" class="tool">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9.5 12 4l8 5.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Stores</span>
      </a>
      <div class="tool-wrap">
        <button type="button" class="tool" (click)="goAccount(); $event.stopPropagation()">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 19.2c1.4-3 3.8-4.4 7-4.4s5.6 1.4 7 4.4"/></svg>
          <span>Account</span>
        </button>
        <div class="account-pop" *ngIf="accountDropOpen" (click)="$event.stopPropagation()">
          <ng-container *ngIf="authService.isLoggedIn; else guestAccount">
            <b>{{ authService.customer?.name || 'Account' }}</b>
            <button type="button" (click)="signOut()">Sign out</button>
          </ng-container>
          <ng-template #guestAccount>
            <a routerLink="/checkout" (click)="accountDropOpen = false">Continue to checkout</a>
          </ng-template>
        </div>
      </div>
      <a routerLink="/wishlist" class="tool">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>
        <span>Wishlist</span>
      </a>
      <button type="button" class="tool" (click)="goCart()">
        <span class="tool-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 4H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
          <em *ngIf="cartService.getCount()">{{ cartService.getCount() }}</em>
        </span>
        <span>Cart</span>
      </button>
    </nav>
  </div>
</header>

<!-- ===== MEGA MENU ===== -->
<div class="mega-menu-overlay" *ngIf="activeMenuId && activeNavItem"
  (mouseenter)="keepMenu()" (mouseleave)="scheduleClose()">
  <div class="mega-menu-inner">
    <div class="mega-sidebar">
      <div *ngFor="let sec of activeNavItem.sections"
        class="mega-sidebar-item"
        [class.active]="activeSection?.id === sec.id"
        (mouseenter)="setSection(sec)">
        {{ sec.name }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>
    <div class="mega-content" *ngIf="activeSection">
      <div class="mega-content-title">{{ activeSection.name }}</div>
      <div class="mega-links">
        <a *ngFor="let link of activeSection.children"
          [routerLink]="['/category', link.id]" (click)="activeMenuId = null">{{ link.name }}</a>
      </div>
    </div>
    <div class="mega-promo">
      <div class="promo-card">
        <img src="https://placehold.co/200x120/7b10b9/ffffff?text=New+In" alt="New In" />
        <span>New In</span>
      </div>
      <div class="promo-card">
        <img src="https://placehold.co/200x120/111827/ffffff?text=Best+Sellers" alt="Best Sellers" />
        <span>Best Sellers</span>
      </div>
    </div>
  </div>
</div>

<!-- ===== MOBILE HEADER ===== -->
<header class="site-header mobile-header">
  <div class="mob-header-inner">
    <button class="mob-icon-btn hamburger-btn" type="button" (click)="openDrawer()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="22" height="22">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <div class="mob-logo">
      <a routerLink="/">
        <img [src]="logoUrl" [alt]="siteName" />
      </a>
    </div>
    <div class="mob-tools">
      <a routerLink="/shop" class="mob-icon-btn" aria-label="Stores">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9.5 12 4l8 5.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      </a>
      <a routerLink="/wishlist" class="mob-icon-btn" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>
      </a>
      <button type="button" class="mob-icon-btn" (click)="goCart()" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 4H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
        <em class="mob-badge" *ngIf="cartService.getCount()">{{ cartService.getCount() }}</em>
      </button>
    </div>
  </div>
  <form class="giva-search mob" (submit)="$event.preventDefault(); onSearch()">
    <input #searchInput type="search" [(ngModel)]="searchTxt" name="mobSearch" [placeholder]="searchPlaceholder" />
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/>
      </svg>
    </button>
  </form>
</header>
</div>

<!-- ===== MOBILE DRAWER ===== -->
<div class="drawer-backdrop" [class.open]="drawerOpen" (click)="closeDrawer()"></div>
<div class="mobile-drawer" [class.open]="drawerOpen" role="dialog" aria-modal="true">
  <div class="drawer-header">
    <button class="drawer-close" (click)="closeDrawer()" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <nav class="drawer-nav">
    <!-- Main pages -->
    <a routerLink="/" class="drawer-nav-item" routerLinkActive="active"
      [routerLinkActiveOptions]="{exact:true}" (click)="closeDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Home
    </a>
    <a routerLink="/shop" class="drawer-nav-item" routerLinkActive="active" (click)="closeDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Shop
    </a>

    <a *ngFor="let item of dynNavItems"
      class="drawer-nav-item drawer-nav-cat"
      [routerLink]="['/category', item.id]"
      (click)="closeDrawer()">
      {{ item.label }}
    </a>
  </nav>

  <div class="drawer-social">
    <a *ngIf="sharedService.siteConfig?.instagramURL"
      [href]="sharedService.siteConfig.instagramURL" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
    </a>
    <a *ngIf="sharedService.siteConfig?.facebookURL"
      [href]="sharedService.siteConfig.facebookURL" target="_blank" rel="noopener" aria-label="Facebook">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/>
      </svg>
    </a>
    <a *ngIf="sharedService.siteConfig?.youtubeURL"
      [href]="sharedService.siteConfig.youtubeURL" target="_blank" rel="noopener" aria-label="YouTube">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 001.46 6.42 29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 001.95-1.96A29 29 0 0023 12a29 29 0 00-.46-5.58z"/>
        <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/>
      </svg>
    </a>
    <a *ngIf="sharedService.siteConfig?.twitterURL"
      [href]="sharedService.siteConfig.twitterURL" target="_blank" rel="noopener" aria-label="Twitter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/>
      </svg>
    </a>
    <a *ngIf="sharedService.siteConfig?.linkedInURL"
      [href]="sharedService.siteConfig.linkedInURL" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"/>
        <rect x="2" y="9" width="4" height="12"/>
        <circle cx="4" cy="4" r="2"/>
      </svg>
    </a>
  </div>
</div>
